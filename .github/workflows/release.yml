name: Release Build

on:
  release:
    types: [created]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            binary: sheets_mcp
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            binary: sheets_mcp
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            binary: sheets_mcp
          - target: x86_64-apple-darwin
            os: macos-latest
            binary: sheets_mcp
          - target: aarch64-apple-darwin
            os: macos-latest
            binary: sheets_mcp
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            binary: sheets_mcp.exe

    runs-on: ${{ matrix.os }}
    name: Build ${{ matrix.target }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync version from tag
        shell: bash
        run: |
          TAG="${{ github.event.release.tag_name }}"
          VERSION="${TAG#v}"
          echo "Setting version to ${VERSION} in Cargo.toml"
          perl -pi -e "s/^version = .*/version = \"${VERSION}\"/" Cargo.toml
          head -5 Cargo.toml

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl cross toolchain
        if: endsWith(matrix.target, '-musl')
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools musl-dev
          if [ "${{ matrix.target }}" = "x86_64-unknown-linux-musl" ]; then
            echo "CC_x86_64_unknown_linux_musl=musl-gcc" >> "$GITHUB_ENV"
          fi
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-musl" ]; then
            sudo apt-get install -y gcc-aarch64-linux-gnu
            echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
            echo "CC_aarch64_unknown_linux_musl=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
          fi

      - name: Cache cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ matrix.target }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ matrix.target }}-cargo-

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Verify static linking
        if: endsWith(matrix.target, '-musl')
        run: |
          BIN=target/${{ matrix.target }}/release/${{ matrix.binary }}
          file "$BIN"
          if ldd "$BIN" 2>&1 | grep -qv 'not a dynamic executable\|statically linked'; then
            echo "::error::Binary is not statically linked"
            ldd "$BIN" || true
            exit 1
          fi

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../${{ matrix.binary }}-${{ matrix.target }}.tar.gz ${{ matrix.binary }}

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          7z a ../../../${{ matrix.binary }}-${{ matrix.target }}.zip ${{ matrix.binary }}

      - name: Upload release asset (Unix)
        if: runner.os != 'Windows'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.event.release.tag_name }}" *.tar.gz --clobber

      - name: Upload release asset (Windows)
        if: runner.os == 'Windows'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.event.release.tag_name }}" *.zip --clobber

  notify:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Release summary
        run: |
          echo "✅ All binaries built and uploaded for ${{ github.event.release.tag_name }}"
          echo "Release URL: ${{ github.event.release.html_url }}"
