[package]
name = "sheets_mcp"
version = "1.0.3"
edition = "2021"
license = "MIT"

[dependencies]
# MCP SDK
rmcp = { version = "1.7", features = ["server", "transport-io"] }
schemars = "1"

# Async
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Excel / Spreadsheet
calamine = "0.26"
umya-spreadsheet = "2.2"

# HTTP (for URL downloads)
reqwest = { version = "0.12", features = ["rustls-tls"], default-features = false }

# Error handling
thiserror = "2"
anyhow = "1"

# Logging
tracing = "0.1"
tracing-subscriber = "0.3"
